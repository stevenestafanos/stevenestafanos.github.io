<body class="viewer-page">
<header class="vbar">
  <a class="back" href="index.html">&larr; Architecture Portfolio</a>
  <div class="vtitle"><span class="eyebrow" id="vCourse"></span><strong id="vTitle">Working drawings</strong></div>
  <label class="setpick"><span class="sr">Drawing set</span><select id="setSelect" aria-label="Drawing set"></select></label>
</header>

<main class="vmain">
  <aside class="sheets" id="sheets" aria-label="Sheets">
    <div class="sheets-head"><span class="eyebrow">Sheets</span><span id="sheetCount" class="eyebrow"></span></div>
    <ol id="sheetList"></ol>
  </aside>

  <section class="stage" id="stage" aria-label="Drawing viewer">
    <div class="canvaswrap" id="canvasWrap" tabindex="0" aria-label="Drawing. Drag to pan, scroll to zoom, double-click to fit."></div>
    <svg class="overlay" id="overlay" aria-hidden="true"></svg>
    <div class="links" id="links"></div>
    <div class="toolbar" role="toolbar" aria-label="Viewer tools">
      <button type="button" id="btnSheets" class="only-narrow" aria-expanded="false">Sheets</button>
      <button type="button" id="btnPrev" aria-label="Previous sheet">&larr;</button>
      <span id="pageLabel" class="pagelabel" aria-live="polite">&ndash;</span>
      <button type="button" id="btnNext" aria-label="Next sheet">&rarr;</button>
      <span class="sep"></span>
      <button type="button" id="btnOut" aria-label="Zoom out">&minus;</button>
      <button type="button" id="btnFit">Fit</button>
      <button type="button" id="btnPrint" title="Zoom to true paper size (96 CSS px = 1 in)">Paper size</button>
      <button type="button" id="btnIn" aria-label="Zoom in">+</button>
      <span class="sep"></span>
      <button type="button" id="btnMeasure" aria-pressed="false">Measure</button>
    </div>
    <div class="measurebar" id="measureBar" hidden>
      <label>Scale for this measurement
        <select id="scaleSelect"></select>
      </label>
      <output id="measureOut" aria-live="polite">Click two points.</output>
      <button type="button" id="btnClear">Clear</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="loading" id="loading" hidden>Loading sheet&hellip;</p>
  </section>
</main>
<noscript><p style="padding:2rem">The drawing viewer needs JavaScript. The PDFs are in the drawings folder.</p></noscript>
